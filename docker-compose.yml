# Convenience wrapper for the pipeline container.
#
#   export REPLICATE_API_TOKEN=r8_...
#   docker compose build
#   docker compose run --rm pipeline                 # full run_all.sh
#   docker compose run --rm pipeline python 01_make_inputs.py   # single stage
#   FAST=1 docker compose run --rm pipeline           # quick Workbench preview
#
# Host folders are mounted so outputs (input/, work/, output/) persist after the
# container exits.
services:
  pipeline:
    build: .
    image: image-to-rotating-video:latest
    environment:
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - FAST=${FAST:-0}
      - SLUG=${SLUG:-WoodenChair_01}
    volumes:
      - ./assets:/app/assets
      - ./input:/app/input
      - ./work:/app/work
      - ./output:/app/output
